<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SlithyMDView">
<meta name="theme-color" content="#f7f6f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>SlithyMDView</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="iphone.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
    <symbol id="i-pilcrow" viewBox="0 0 24 24"><path d="M13 4v16M17 4v16M19 4H9.5a4.5 4.5 0 0 0 0 9H13"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M9 7h6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 1-2z"/><path d="M8 3v5h7V3"/><path d="M8 21v-7h8v7"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
  </defs>
</svg>

<div id="app" class="mode-view">
  <header class="toolbar">
    <div class="seg" role="group" aria-label="Mode">
      <button id="btn-view" class="seg-btn active" title="View the formatted page (Ctrl+E)"><svg><use href="#i-eye"/></svg><span>View</span></button>
      <button id="btn-edit" class="seg-btn" title="Edit the raw text (Ctrl+E)"><svg><use href="#i-pen"/></svg><span>Edit</span></button>
    </div>
    <div class="docname"><span id="doc-name">Welcome</span><span class="dirty-dot" title="Unsaved changes"></span></div>
    <div class="grow"></div>
    <button id="btn-split" class="tb-btn edit-only" title="Live preview beside the text (Ctrl+\)"><svg><use href="#i-split"/></svg><span>Split</span></button>
    <button id="btn-reveal" class="tb-btn" title="Show all markup (Ctrl+Shift+M)"><svg><use href="#i-pilcrow"/></svg><span>Markup</span></button>
    <button id="btn-cheats" class="tb-btn" title="Markdown cheat sheet (F1)"><svg><use href="#i-book"/></svg><span>Cheat sheet</span></button>
    <span class="tb-sep"></span>
    <button id="btn-open" class="tb-btn icon" title="Open (Ctrl+O)" aria-label="Open"><svg><use href="#i-folder"/></svg></button>
    <button id="btn-save" class="tb-btn icon" title="Save (Ctrl+S)" aria-label="Save"><svg><use href="#i-save"/></svg></button>
    <div class="menu-wrap">
      <button id="btn-more" class="tb-btn icon" title="More" aria-label="More"><svg><use href="#i-more"/></svg></button>
      <div id="menu" class="menu" hidden>
        <button data-action="saveAs">Save as…<kbd>Ctrl+Shift+S</kbd></button>
        <button data-action="print">Print…<kbd>Ctrl+P</kbd></button>
        <button data-action="reveal-file" class="host-only">Show in folder</button>
        <div class="menu-sep"></div>
        <div class="menu-label">Theme</div>
        <div class="menu-row">
          <button data-theme-choice="auto">Auto</button><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button>
        </div>
        <div class="menu-sep host-only"></div>
        <button data-action="register" class="host-only">Use SlithyMDView for .md files…</button>
        <div class="menu-sep"></div>
        <div class="menu-label" id="menu-version"></div>
      </div>
    </div>
  </header>

  <div class="fmtbar edit-only" role="toolbar" aria-label="Formatting">
    <button data-cmd="heading" title="Heading level (Ctrl+H)"><b>H</b></button>
    <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button data-cmd="strike" title="Strikethrough (Ctrl+Shift+X)"><s>S</s></button>
    <button data-cmd="code" title="Inline code (Ctrl+`)"><code>&lt;/&gt;</code></button>
    <span class="fmt-sep"></span>
    <button data-cmd="link" title="Link (Ctrl+K)">Link</button>
    <button data-cmd="image" title="Image">Image</button>
    <span class="fmt-sep"></span>
    <button data-cmd="bullet" title="Bulleted list">• List</button>
    <button data-cmd="numbered" title="Numbered list">1. List</button>
    <button data-cmd="task" title="Task list">☐ Task</button>
    <button data-cmd="quote" title="Quote">❝ Quote</button>
    <span class="fmt-sep"></span>
    <button data-cmd="codeblock" title="Code block">Code block</button>
    <button data-cmd="table" title="Table">Table</button>
    <button data-cmd="hr" title="Horizontal rule">― Rule</button>
  </div>

  <main class="workspace">
    <section id="editor-pane"><div id="editor"></div></section>
    <section id="viewer-wrap"><article id="viewer" class="md"></article></section>
    <aside id="cheats" aria-label="Markdown cheat sheet">
      <div class="cheats-head">
        <h2>Cheat sheet</h2>
        <button id="cheats-close" class="tb-btn icon" title="Close (Esc)" aria-label="Close">✕</button>
      </div>
      <input id="cheat-filter" type="search" placeholder="Filter…" spellcheck="false">
      <div id="cheat-list"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="st-path"></span>
    <span class="grow"></span>
    <span id="st-pos" class="edit-only"></span>
    <span id="st-words"></span>
    <span id="st-mode"></span>
  </footer>

  <div id="toast" role="status"></div>
  <div id="drop-hint"><div>Drop a Markdown file to open it</div></div>
</div>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
